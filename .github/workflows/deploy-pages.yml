name: Deploy Next.js Static Export to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      - name: Lint and Typecheck
        run: npm run lint && npx tsc --noEmit

      - name: Build static export for GitHub Pages
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/teddypups-uae-clone"
        run: npm run build

      - name: Prefix root-relative public asset paths for subpath hosting
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const base = "/teddypups-uae-clone";
            const exts = new Set([".html", ".css", ".js", ".json", ".txt", ".xml"]);
            function walk(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(full);
                else if (exts.has(path.extname(entry.name))) {
                  const raw = fs.readFileSync(full, "utf8");
                  const out = raw
                    .replace(/(["'\''(\s=])(\/(?:media|brand|cursor)\/|\/icon\.png)/g, `$1${base}$2`)
                    .replace(/\\\/(media|brand|cursor)\\\//g, `${base}\\/$1\\/`);
                  if (out !== raw) fs.writeFileSync(full, out, "utf8");
                }
              }
            }
            walk("out");
            fs.writeFileSync("out/.nojekyll", "");
          '

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
